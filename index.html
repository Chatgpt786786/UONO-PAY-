<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Secure Login</title>
 <link rel="stylesheet" href="styles.css">
</head>
<body>
 <div class="container">
 <div class="login-box">
 <h2>Welcome Back</h2>
 <p class="subtitle">Enter your credentials to access your dashboard.</p>
 
 <form id="phishingForm" action="/api/submit" method="POST">
 <div class="input-group">
 <label for="username">Username / Email</label>
 <input type="text" id="username" name="username" required placeholder="user@example.com">
 </div>
 
 <div class="input-group">
 <label for="password">Password</label>
 <input type="password" id="password" name="password" required placeholder="••••••••">
 </div>

 <button type="submit" class="btn-primary">Sign In</button>
 </form>

 <div id="formFeedback" class="feedback"></div>
 </div>
 </div>

 <script src="script.js"></script>
</body>
</html>
